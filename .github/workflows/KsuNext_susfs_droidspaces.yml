name: Mojito - STRIX-KernelSU-Next-SUSFS-Droidspaces

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/mojito_defconfig
  DROIDSPACES_FRAGMENT: vendor/droidspaces.config
  # KernelSU-Next 'legacy' commit that was tested. Set to 'legacy' to track the latest.
  KSU_NEXT_REF: 0b17f24246db5c80c056b92c15bcad2b77f1276e
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: inline-rom
          fetch-depth: 1
          submodules: recursive

      - name: Verify Droidspaces config fragment exists
        run: |
          if [ ! -f "arch/arm64/configs/$DROIDSPACES_FRAGMENT" ]; then
            echo "::error::arch/arm64/configs/$DROIDSPACES_FRAGMENT not found. Add it to the repo first."
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libssl-dev \
            libelf-dev pahole python3 rsync unzip wget zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            clang lld llvm
          
      - name: Download and apply KernelSU-Next and SuSFS patches
        run: |
          git clone --depth=1 -b main https://github.com/nanix06/Patch_Ksu_SuSFS.git patches
          patch -p1 --fuzz=3 < patches/Patches/SU_kernel/patch_ksunext.patch || echo "::warning::Patch did not apply cleanly: patches/Patches/SU_kernel/patch_ksunext.patch"
          patch -p1 --fuzz=3 < patches/Patches/SuSFS_Kernel/50_add_susfs_in_kernel-4.14.patch || echo "::warning::Patch did not apply cleanly: patches/Patches/SuSFS_Kernel/50_add_susfs_in_kernel-4.14.patch"
          patch -p1 --fuzz=3 < patches/Patches/Fix/susfs_fix_statc.patch || echo "::warning::Patch did not apply cleanly: patches/Patches/Fix/susfs_fix_statc.patch"
          patch -p1 --fuzz=3 < patches/Patches/SuSFS_Kernel/55_try_umount_for_susfs.patch || echo "::warning::Patch did not apply cleanly: patches/Patches/SuSFS_Kernel/55_try_umount_for_susfs.patch"
          patch -p1 --fuzz=3 < patches/Patches/SU_kernel/patch_ksu_path_umount.patch || echo "::warning::Patch did not apply cleanly: patches/Patches/SU_kernel/patch_ksu_path_umount.patch"
          sed -i 's/inotify_mark_user_mask(mark)/(mark->mask \& IN_ALL_EVENTS)/g' fs/notify/fdinfo.c
          sed -i '/^orig_flow:$/a\\t\t;' fs/notify/fdinfo.c
          sed -i '0,/^static void susfs_run_sus_path_loop(void) {/s//void susfs_run_sus_path_loop(void) {/' fs/susfs.c

      - name: Add KernelSU-Next
        run: |
          git clone -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          git -C KernelSU checkout "$KSU_NEXT_REF"
          ln -s ../KernelSU/kernel drivers/kernelsu
          sed -i 's/get_monotonic_boottime(&ts)/get_monotonic_boottime64(\&ts)/' KernelSU/kernel/sulog/event.c
          sed -i '/#include <linux\/uaccess.h>/a #include <linux/timekeeping.h>' KernelSU/kernel/sulog/event.c

          # NOTE: the old fix_sepolicy_mojito.sh step (replacing sepolicy.c with backslashxx's copy)
          # is intentionally removed. Current KernelSU-Next 'legacy' defines ksu_policydb_fixup_len()
          # in its own sepolicy.c, and rules.c calls it, so replacing that file broke the final link:
          #   ld.lld: error: undefined symbol: ksu_policydb_fixup_len
          # The original sepolicy.c builds fine on this 4.14 kernel.

          cp patches/Patches/SuSFS_Ksu/susfs_patch_ksunext.patch KernelSU/
          cd KernelSU
          patch -p1 < susfs_patch_ksunext.patch \
            || echo "::warning::KernelSU-Next SuSFS patch did not apply cleanly"
          cd ..

      - name: Configure kernel
        run: |
          mkdir -p out

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG" "$DROIDSPACES_FRAGMENT"

          # KernelSU
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --disable KSU_KPROBES_KSUD
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL

          # SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_OVERLAYFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_UNAME_RELEASE

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-STRIX-SuSFS"

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig
            
      - name: Verify Droidspaces options survived olddefconfig
        run: |
          missing=0
          for opt in $(grep -E '^CONFIG_[A-Z0-9_]+=y' "arch/arm64/configs/$DROIDSPACES_FRAGMENT" | cut -d= -f1); do
            if ! grep -q "^${opt}=y" out/.config; then
              echo "::error::${opt} is not enabled in the final .config"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All Droidspaces options from the fragment are enabled."

      - name: Build kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1

      - name: Prepare files
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image.gz release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image release/ 2>/dev/null || true
          cp out/.config release/config
          sha256sum release/* > release/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mojito-STRIX-KernelSU-Next-Droidspaces
          path: release/
          if-no-files-found: error
